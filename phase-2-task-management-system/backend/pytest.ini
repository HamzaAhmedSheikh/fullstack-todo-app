[pytest]

# Pytest configuration - Using Neon Database for tests

asyncio_mode = auto

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

# Markers
markers =
    asyncio: mark test as async
    unit: Unit tests
    integration: Integration tests
    contract: Contract tests
    auth: Authentication tests
    isolation: User isolation tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --disable-warnings
    -p no:warnings

# WARNING: Using real database in tests
# - Creates/drops tables on each test
# - Slower than SQLite in-memory
# - Use for integration tests only
