[project]
name = "task_management_backend"
version = "0.1.0"
description = "Task Management Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.125.0",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "pyjwt[crypto]>=2.8.0",
    "sqlmodel>=0.0.27",
    "uvicorn[standard]>=0.38.0",
    "cryptography>=41.0.0",
    "psycopg[binary]>=3.3.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.0",
    "alembic>=1.17.2",
    "black>=25.12.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
testpaths = [
    "tests",
]

[tool.uv.workspace]
members = [
    "app/student-api",
]
